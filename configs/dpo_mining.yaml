model:
  adapter_path: /root/align-sql/outputs/sft-qwen2.5-coder-7b-qlora/final_adapter
  trust_remote_code: false
  attn_implementation: sdpa
  load_in_4bit: true

data:
  path: data/processed/sft_train.jsonl
  sample_size: 2000
  exclude_question_ids:
    - 2809
    - 7769
  seed: 42
  max_input_length: 3072

sampling:
  num_candidates: 4
  prompt_batch_size: 2
  max_new_tokens: 768
  temperature: 0.7
  top_p: 0.95
  seed: 42

execution:
  db_root: /root/autodl-tmp/bird/train/train_databases
  timeout_seconds: 30.0
  max_result_rows: 100000

pairing:
  include_execution_error_rejected: false
  validation_ratio: 0.05
  seed: 42

output:
  dir: /root/align-sql/outputs/dpo-mining-k4
